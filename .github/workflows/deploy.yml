name: Deploy to AWS VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build (type-check + compile)
        run: npm run build

      - name: Restart application with PM2
        run: |
          pm2 delete vibeconverter || true
          pm2 start "npm start --workspace server" --name vibeconverter
          pm2 save
